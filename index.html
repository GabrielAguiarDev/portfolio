             probe: the implicit request is a guess that costs a 404 round trip
             wherever the file is not exactly there, and crawlers read the tag. -->

        <!--
            ── Type, served from this origin ─────────────────────────────────

            This used to be a <link rel="stylesheet"> to fonts.googleapis.com.
            That is a render-blocking request to a third party which cannot
            even begin until DNS and TLS to a second host are done, and it
            then names files on a *third* host (fonts.gstatic.com) that only
            start downloading once that CSS has come back and parsed. Two
            preconnects were paying to soften a round trip that did not have
            to exist. Per-site cache partitioning killed the old argument for
            using Google's CDN — a visitor's browser cannot reuse the copy it
            fetched for someone else's site, so the bytes were being paid for
            here anyway, just more slowly and from further away.

            Self-hosted, the files sit behind the connection that is already
            open for the document, and the immutable cache header in
            vercel.json holds them for a year.

            The @font-face rules below are Google's own, copied verbatim from
            the CSS that link returned — same faces, same font-display: swap,
            same unicode-ranges — with only the URLs pointed at /fonts. That
            is deliberate and the rules must stay verbatim:

            - Inter and Inter Tight are VARIABLE fonts. All three of Inter's
              declared weights resolve to one file, and so do Inter Tight's.
              The per-weight blocks look redundant and are not: they are what
              pins each family to exactly the weights the design asked for.
              Collapsing them into one `font-weight: 100 900` block would let
              the browser render real weights it currently synthesises, which
              would change how the page looks.
            - Only the `latin` and `latin-ext` subsets are kept. Cyrillic,
              Greek and Vietnamese were never downloaded — a subset is fetched
              only when a character in its range is painted, and this site is
              Portuguese and English. `latin` covers every accent either one
              uses (its range opens at U+0000-00FF).

            Inlined rather than linked so it costs no request at all. Two
            preloads go ahead of it: body copy is Inter and every heading is
            Inter Tight, so both are certain to be needed, and preloading
            starts them during HTML parse instead of after the CSS is read.
        -->
        <link
            rel="preload"
            href="/fonts/inter-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/inter-tight-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <meta property="og:title" content="Gabriel Aguiar — Software Engineer" />
        <meta
            property="og:description"
            content="I build the whole product, not just the screen. Architecture, product and delivery — with AI treated as engineering and security treated as a design decision."
        />
        <meta property="og:url" content="https://www.gabrielaguiar.dev/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Gabriel Aguiar" />
        <!--
            The language *these tags* are in, not the one the app prefers.
            Title, description and og:description in this file are English, and
            the app's own fallback is English (src/i18n/config.ts), so a crawler
            that cannot run JavaScript is reading English. Declaring pt_BR here
            described a page nobody was served. `useDocumentMeta` rewrites this
            from the active locale once the app boots.
        -->
        <meta property="og:locale" content="en_US" />
        <meta property="og:locale:alternate" content="pt_BR" />
        <!--
            `summary`, with the portrait, rather than `summary_large_image`.
            The small card is square and the portrait already is — so this is
            the one image in /public that fits the format without being
            cropped into something unintended. Every shared link used to render
            with no image at all.
            TODO: a purpose-made /public/og.png at 1200x630 would allow
            `summary_large_image`, which is the larger and better card. Swap
            both tags together when one exists.
        -->
        <meta name="twitter:card" content="summary" />
        <meta property="og:image" content="https://www.gabrielaguiar.dev/profile.jpg" />
        <meta property="og:image:width" content="1254" />
        <meta property="og:image:height" content="1254" />
        <meta property="og:image:alt" content="Gabriel Aguiar" />

        <!--
            One graph, not three loose objects.

            The nodes carry `@id` and refer to each other, which is what lets a
            search engine know the WebSite is published by the same person the
            page is about — three unconnected blocks would state three facts and
            imply no relationship between them.

            Kept static here rather than built at runtime: it never changes, and
            a crawler that does not execute JavaScript still reads it.

            Deliberately absent: `WebSite.potentialAction` / SearchAction. There
            is no search on this site, declaring one that does not exist is a
            structured lie, and Google retired the sitelinks searchbox anyway.
        -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "Person",
                        "@id": "https://www.gabrielaguiar.dev/#person",
                        "name": "Gabriel Aguiar",
                        "givenName": "Gabriel",
                        "familyName": "Aguiar",
                        "url": "https://www.gabrielaguiar.dev/",
                        "image": "https://www.gabrielaguiar.dev/profile.jpg",
                        "jobTitle": "Software Engineer",
                        "description": "Software engineer building complete products — architecture, implementation and delivery.",
                        "address": {
                            "@type": "PostalAddress",
                            "addressCountry": "BR"
                        },
                        "knowsLanguage": ["pt-BR", "en"],
                        "knowsAbout": [
                            "Software architecture",
                            "React Native",
                            "React",
                            "Next.js",
                            "TypeScript",
                            "Mobile application development",
                            "Web application development",
                            "AI-assisted software development",
                            "Large language models",

                            "AI agent orchestration",

                        ]

                        "@type": "WebSite",

                        "name": "Gabriel Aguiar — Software Engineer",
                        "inLanguage": ["pt-BR", "en"],
